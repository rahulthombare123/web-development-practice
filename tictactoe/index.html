<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TicTacToe — X vs O</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="container">

    <header class="header">
      <h1 class="title">TIC<span class="accent">TAC</span>TOE</h1>
      <p class="subtitle">X vs O — Claim the Grid</p>
    </header>

    <div class="scoreboard">
      <div class="score-card" id="score-x">
        <span class="score-symbol x-symbol">X</span>
        <span class="score-label">Player X</span>
        <span class="score-value" id="x-score">0</span>
      </div>
      <div class="score-divider">
        <span class="draw-label">DRAW</span>
        <span class="score-value" id="draw-score">0</span>
      </div>
      <div class="score-card" id="score-o">
        <span class="score-symbol o-symbol">O</span>
        <span class="score-label">Player O</span>
        <span class="score-value" id="o-score">0</span>
      </div>
    </div>

    <div class="turn-indicator">
      <div class="turn-badge" id="turn-badge">
        <span id="turn-symbol">X</span>
        <span id="turn-text">'s Turn</span>
      </div>
    </div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="reset-btn">↺ New Round</button>
      <button class="btn btn-clear" id="clear-btn">✕ Reset Scores</button>
    </div>

  </div>

  <!-- Win Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-symbol" id="modal-symbol"></div>
      <h2 class="modal-title" id="modal-title">Player X Wins!</h2>
      <p class="modal-sub" id="modal-sub">The grid has been claimed.</p>
      <button class="btn btn-reset modal-btn" id="modal-btn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
