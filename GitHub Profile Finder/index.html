<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <nav>
      <div class="logo">
        <img
          src="images/GitHub_Invertocat_White.svg"
          alt="GitHub Logo"
          width="40"
          height="40"
        >
        <h1>GitHub Profile Finder</h1>
      </div>

      <a
        href="https://github.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="images/GitHub_Lockup_White.svg"
          alt="GitHub"
          height="30"
        >
      </a>
    </nav>
  </header>

  <!-- Search Section -->
  <section class="search-section">
    <div class="search-box">

      <div class="input-box">
        <img
          src="images/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
          alt="Search"
          width="24"
          height="24"
        >

        <input
          type="text"
          id="username"
          placeholder="Enter GitHub username"
          autocomplete="off" 
        >
      </div>

      <button id="search-btn">
        Search
      </button>

    </div>
  </section>

   <!-- profile Section -->
  <section class="profile-section">
  <div class="profile-card">
    <h2>👤 GitHub Profile</h2>
    <p>Search for a GitHub user above to see their profile.</p>
  </div>
</section>


<!---footer--->
<footer>
  <p>
    Made with ❤️ by Rahul Thombare
  </p>

</footer>

  <script src="script.js"></script>
</body>
</html>
