<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Night Effect - My Project</title>
  <meta name="description" content="A simple hero section showing a day and night theme switcher built with HTML, CSS and JavaScript.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">

    <button id="themeToggle" class="theme-toggle" aria-label="Switch between day and night theme">
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
        <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="hero-content">
      <p class="eyebrow">Hi, this is my project</p>
      <h1>Day &amp; Night Effect</h1>
      <p class="hero-text">
        Click the sun or moon button to switch between light and dark mode.
        Built with plain HTML, CSS and JavaScript.
      </p>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
