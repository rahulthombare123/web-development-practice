<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Palette — Paint Chip Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ddd4bd;
    --panel: #cfc3a3;
    --paper: #2a2318;
    --ink: #2a2318;
    --muted: #6b6047;
    --line: #a89a76;
    --accent: #9c2b2b;

    /* active palette (JS overwrites these on generate) */
    --c1: #cfc3a3;
    --c2: #b8a97f;
    --c3: #a89a76;
    --c4: #94875f;
    --c5: #6b6047;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--paper);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding: 48px 24px 80px;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px);
  }

  .wrap{ max-width: 1040px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
    margin-bottom: 36px;
  }

  .eyebrow{
    font-family:'Courier Prime', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }

  h1{
    font-family:'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 6.5vw, 68px);
    line-height: 0.92;
    margin: 0;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }

  h1 em{
    font-style: normal;
    font-weight: 400;
    color: var(--accent);
  }

  .meta{
    font-family:'Courier Prime', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align:right;
    max-width: 220px;
    line-height: 1.5;
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    gap: 14px;
    align-items:center;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .select-shell{
    position: relative;
    display:flex;
    align-items:center;
  }

  select{
    appearance:none;
    -webkit-appearance:none;
    background: var(--panel);
    color: var(--ink);
    border: 2px solid var(--ink);
    padding: 14px 44px 14px 18px;
    font-family:'Courier Prime', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing:0.03em;
    border-radius: 0;
    cursor:pointer;
    min-width: 240px;
  }
  select:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .select-shell::after{
    content:"▾";
    position:absolute;
    right: 16px;
    color: var(--accent);
    pointer-events:none;
    font-size: 12px;
  }

  button#generateBtn{
    background: var(--accent);
    color: #f2ead6;
    border: none;
    font-family:'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 17px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 13px 28px;
    border-radius: 0;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button#generateBtn:hover{ background:#7e2222; }
  button#generateBtn:active{ transform: scale(0.97); }
  button#generateBtn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  .mood-tag{
    font-family:'Courier Prime', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .mood-tag b{ color: var(--ink); font-weight:700; }

  /* ---------- Card grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
  }
  @media (max-width: 900px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px){
    .grid{ grid-template-columns: 1fr; }
  }

  .card{
    perspective: 1200px;
    height: 300px;
  }

  .card-inner{
    position: relative;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.2,.8,.2,1);
  }

  .card.flipped .card-inner{
    transform: rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius: 2px;
    border: 2px solid var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .face-front{
    background: var(--panel);
    align-items:center;
    justify-content:center;
    color: var(--muted);
    font-family:'Courier Prime', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .face-front .hole{
    width:14px; height:14px;
    border-radius:50%;
    border: 1.5px solid var(--line);
    margin-bottom: 14px;
  }

  .face-back{
    background: var(--swatch, #333);
    transform: rotateY(180deg);
    cursor: pointer;
    justify-content: space-between;
    padding: 16px;
    position: relative;
  }

  .face-back .hole{
    width:14px; height:14px;
    border-radius:50%;
    background: rgba(0,0,0,0.18);
    align-self:center;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }

  .swatch-label{
    font-family:'Courier Prime', monospace;
  }

  .swatch-index{
    font-size: 11px;
    letter-spacing: 0.12em;
    opacity: 0.7;
    text-transform: uppercase;
    font-weight: 700;
  }

  .swatch-hex{
    font-family:'Bebas Neue', sans-serif;
    font-size: 28px;
    font-weight: 400;
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  .copy-hint{
    position:absolute;
    bottom: 14px;
    right: 16px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.75;
    font-family:'Courier Prime', monospace;
    font-weight: 700;
  }

  .face-back.copied .copy-hint::after{
    content: " ✓ copied";
  }
  .face-back .copy-hint::after{
    content: " · click to copy";
  }

  /* text contrast decided in JS via data-dark attribute */
  .face-back[data-dark="true"]{ color: #201a10; }
  .face-back[data-dark="false"]{ color: #f2ead6; }

  /* ---------- toast ---------- */
  #toast{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #f2ead6;
    font-family:'Courier Prime', monospace;
    font-size: 13px;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 0;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 10;
  }
  #toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer{
    margin-top: 48px;
    font-family:'Courier Prime', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    border-top: 2px solid var(--ink);
    padding-top: 18px;
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Blueprint No. 041 / Color Utility</p>
      <h1>Mood Palette <em>Generator</em></h1>
    </div>
    <div class="meta">
      Five-swatch decks tuned<br> to a chosen emotion.<br> Click any chip to copy its hex.
    </div>
  </header>

  <div class="controls">
    <div class="select-shell">
      <select id="moodSelect" aria-label="Choose a mood">
        <option value="cyberpunk">Cyberpunk</option>
        <option value="cozyAutumn">Cozy Autumn</option>
        <option value="oceanCalm">Ocean Calm</option>
        <option value="cherryBlossom">Cherry Blossom</option>
        <option value="midnightForest">Midnight Forest</option>
        <option value="desertSunset">Desert Sunset</option>
      </select>
    </div>
    <button id="generateBtn">Generate Palette</button>
    <span class="mood-tag">Showing: <b id="moodTag">—</b></span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    100 Code Blueprints — Beginner/Intermediate JS mini-project. Vanilla HTML · CSS · JS, no dependencies.
  </footer>
</div>

<div id="toast">Copied to clipboard</div>

<script>
  // ---- Mood palette data ----
  const PALETTES = {
    cyberpunk: ["#0d0221", "#ff2079", "#00f0ff", "#f9f871", "#7b2ff7"],
    cozyAutumn: ["#5c3a21", "#a85c32", "#d98324", "#eec170", "#8a9b68"],
    oceanCalm: ["#03045e", "#0077b6", "#00b4d8", "#90e0ef", "#caf0f8"],
    cherryBlossom: ["#402d38", "#e8a0bf", "#f7c6d9", "#fbe4ec", "#c96f8c"],
    midnightForest: ["#0b132b", "#1c2541", "#3a506b", "#5bc0be", "#6fffe9"],
    desertSunset: ["#2b0f0f", "#7c2f3e", "#d1495b", "#f0a04b", "#f6d186"]
  };

  const MOOD_LABELS = {
    cyberpunk: "Cyberpunk",
    cozyAutumn: "Cozy Autumn",
    oceanCalm: "Ocean Calm",
    cherryBlossom: "Cherry Blossom",
    midnightForest: "Midnight Forest",
    desertSunset: "Desert Sunset"
  };

  const grid = document.getElementById('grid');
  const moodSelect = document.getElementById('moodSelect');
  const generateBtn = document.getElementById('generateBtn');
  const moodTag = document.getElementById('moodTag');
  const toast = document.getElementById('toast');

  let toastTimer = null;

  function relativeLuminance(hex){
    const c = hex.replace('#','');
    const r = parseInt(c.substring(0,2),16)/255;
    const g = parseInt(c.substring(2,4),16)/255;
    const b = parseInt(c.substring(4,6),16)/255;
    const lin = v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
    return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  }

  function buildCards(){
    grid.innerHTML = '';
    for(let i=0; i<5; i++){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-inner">
          <div class="face face-front">
            <div class="hole"></div>
            <span>Swatch 0${i+1}</span>
          </div>
          <div class="face face-back" data-index="${i}">
            <div class="hole"></div>
            <div class="swatch-label">
              <div class="swatch-index">Chip 0${i+1}</div>
              <div class="swatch-hex"></div>
            </div>
            <div class="copy-hint"></div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  async function copyHex(hex, faceEl){
    try{
      await navigator.clipboard.writeText(hex);
    }catch(err){
      // fallback for older browsers
      const tmp = document.createElement('textarea');
      tmp.value = hex;
      document.body.appendChild(tmp);
      tmp.select();
      document.execCommand('copy');
      document.body.removeChild(tmp);
    }
    showToast(`${hex.toUpperCase()} copied`);
    faceEl.classList.add('copied');
    setTimeout(() => faceEl.classList.remove('copied'), 1200);
  }

  function renderPalette(moodKey, animate){
    const colors = PALETTES[moodKey];
    moodTag.textContent = MOOD_LABELS[moodKey];

    const cards = document.querySelectorAll('.card');
    cards.forEach((card, i) => {
      const hex = colors[i];
      const backFace = card.querySelector('.face-back');
      const hexLabel = card.querySelector('.swatch-hex');

      const applyColor = () => {
        backFace.style.setProperty('--swatch', hex);
        hexLabel.textContent = hex.toUpperCase();
        const lum = relativeLuminance(hex);
        backFace.setAttribute('data-dark', lum > 0.45 ? 'true' : 'false');
      };

      if(animate){
        card.classList.remove('flipped');
        // force a fresh flip animation even if same card
        setTimeout(() => {
          applyColor();
          requestAnimationFrame(() => {
            setTimeout(() => card.classList.add('flipped'), 60 + i*70);
          });
        }, 30);
      }else{
        applyColor();
        card.classList.add('flipped');
      }

      // click-to-copy (bind once)
      if(!backFace.dataset.bound){
        backFace.addEventListener('click', () => {
          const currentHex = backFace.querySelector('.swatch-hex').textContent;
          copyHex(currentHex, backFace);
        });
        backFace.dataset.bound = 'true';
      }
    });
  }

  buildCards();
  renderPalette(moodSelect.value, false);

  generateBtn.addEventListener('click', () => {
    renderPalette(moodSelect.value, true);
  });

  moodSelect.addEventListener('change', () => {
    renderPalette(moodSelect.value, true);
  });
</script>

</body>
</html>
